name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Tag name for a manual release (e.g. v0.2.0-test). Leave empty to
          derive one from git describe.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so `git describe --tags` in the Makefile sees the tags.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --always)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Build release binaries
        run: make release VERSION="${{ steps.tag.outputs.tag }}"

      - name: Build Debian packages
        run: make deb VERSION="${{ steps.tag.outputs.tag }}"

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/nm-webui-linux-arm64
            dist/nm-webui-linux-amd64
            dist/checksums.txt
            dist/*.deb
          generate_release_notes: true