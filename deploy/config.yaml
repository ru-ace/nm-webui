# nm-webui configuration
# Copy to /etc/nm-webui/config.yaml or use --config flag
# All options can also be set via environment variables (NM_WEBUI_*)
# or command line flags (highest priority)

# HTTP listen address (IP:port)
listen: "0.0.0.0:8090"

# Admin password for HTTP Basic Auth (empty = no auth)
# Can also be set via NM_WEBUI_AUTH_PASS env var
auth-pass: ""

# Regex to filter visible interfaces (default: physical only)
# Excludes docker/veth/virbr/vboxnet/etc. "cdc" covers mobile
# broadband control ports such as cdc-wdm0.
interface-filter: "^(eth|en|wlan|wifi|wwan|wwan0|cdc|wl|ra|usb)[0-9A-Za-z.@_-]*$"

# Enable HTTPS with auto-generated self-signed cert or provided files
tls: false
tls-cert: ""
tls-key: ""

# Log level: debug, info, warn, error
log-level: "info"

# WiFi connection timeout in seconds
connect-timeout: 45

# How often the background captive-portal probe re-checks connectivity
# (seconds). NM verdicts are NOT used for portal detection — the probe is
# the judge, NM only triggers re-checks. Default: 30.
# Can also be set via NM_WEBUI_PORTAL_CHECK_INTERVAL env var.
portal-check-interval: 30

# Comma-separated probe URLs for captive-portal detection; leave empty for
# the defaults (captive.apple.com, detectportal.firefox.com).
portal-check-urls: ""

# Allow portal JavaScript to run in the sandboxed iframe (disable to strip
# scripts from proxied portal pages).
portal-allow-js: true

# Password for the Power section (reboot / power off from the web UI).
# Empty = section hidden. Non-root installs need deploy/sudoers/nm-webui-power
# installed (deploy/install.sh does it automatically); see README.
# Can also be set via NM_WEBUI_POWER_ACTION_PASSWORD env var.
power-action-password: ""